# Sobreposição para desenvolvimento local. Não utilize em produção.
services:
  backend:
    environment:
      APP_ENV: development
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    environment:
      REACT_APP_API_URL: http://localhost:8001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    ports:
      - "5434:5432"

  redis:
    ports:
      - "6379:6379"

networks:
  web_network:
    external: false
