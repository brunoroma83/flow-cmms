[project]
name = "flow-cmms"
version = "0.1.0"
description = "Sistema de Gerenciamento de Equipamentos Médicos"
authors = [
    {name = "Seu Nome", email = "seu.email@exemplo.com"}
]
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pydantic-settings==2.0.3",
    "python-jose==1.7.0",
    "passlib==1.7.4",
    "python-multipart==0.0.6",
    "psycopg2-binary==2.9.7",
    "alembic==1.13.1",
    "openai==1.3.5",
    "google-generativeai==0.4.0",
    "python-telegram-bot==20.7",
    "gunicorn==21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "httpx==0.25.1",
    "ruff==0.4.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
flow-cmms = "backend.app.main:app"

[tool.uv]
