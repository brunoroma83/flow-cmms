[project]
name = "flow-cmms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bruno Roma", email = "bruuno@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic==1.13.1",
    "fastapi==0.109.0",
    "google-generativeai==0.4.0",
    "gunicorn==21.2.0",
    "httpx==0.25.2",
    "openai==1.3.5",
    "passlib==1.7.4",
    "psycopg2==2.9.7",
    "pydantic-settings==2.0.3",
    "pytest==7.4.3",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart==0.0.6",
    "python-telegram-bot==20.7",
    "sqlalchemy==2.0.23",
    "uvicorn[standard]==0.24.0",
]

[project.scripts]
flow-cmms = "flow_cmms:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
