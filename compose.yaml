services:
  backend:
    build: .
    container_name: flow_cmms_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-cmms_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      APP_ENV: ${APP_ENV:-production}
#   ports:
#     - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - web_network
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flow_cmms_frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8001}
#   ports:
#     - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - web_network

  db:
    image: postgres:15-alpine
    container_name: flow_cmms_db
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmms_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
#   ports:
#     - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: flow_cmms_redis
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
#   ports:
#     - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  postgres_data:

networks:
  web_network:
    external: true
