services:
  backend:
    build: .
    container_name: flow_cmms_backend
    environment:
      DATABASE_URL: postgresql://${CMMS_DB_USER:-flow_cmms_user}:${CMMS_DB_PASSWORD:-cmms_password}@postgres:5432/${CMMS_DB_NAME:-flow_cmms_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-before-production}
      APP_ENV: ${APP_ENV:-production}
#   ports:
#     - "8001:8000"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - web_network
      - postgres_network
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flow_cmms_frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8001}
#   ports:
#     - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - web_network

  redis:
    image: redis:7-alpine
    container_name: flow_cmms_redis
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  web_network:
    external: true
  postgres_network:
    external: true
